<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
<link rel="mask-icon" href="./favicon.svg" color="#22d3ee" />

    <!-- SEO TOKENS — do NOT hand-edit the values below.
         These tokens are filled automatically from src/data/portfolio.js by the
         Vite plugin in vite/transformHtml.js, both in `npm run dev` and in
         `npm run build`. To change the name, title, description, site URL,
         preview image or email: edit src/data/portfolio.js (the `identity`,
         `seo` and `contact` blocks) — that is the ONLY file you need. -->
    <title>{NAME} — {TITLE}</title>
    <meta
      name="description"
      content="{DESCRIPTION}"
    />
    <meta name="author" content="{NAME}" />
    <meta name="theme-color" content="#0a0f1c" />
    <meta name="color-scheme" content="dark light" />
    <link rel="canonical" href="{SITE_URL}" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{NAME} — Portfolio" />
    <meta property="og:title" content="{NAME} — {TITLE}" />
    <meta property="og:description" content="{DESCRIPTION}" />
    <meta property="og:url" content="{SITE_URL}" />
    <meta property="og:image" content="{OG_IMAGE}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{NAME} — {TITLE}" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{NAME} — {TITLE}" />
    <meta name="twitter:description" content="{DESCRIPTION}" />
    <meta name="twitter:image" content="{OG_IMAGE}" />

    <!-- Prevent flash of wrong theme before React hydrates. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('noc-theme')
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches
          var theme = stored || (prefersLight ? 'light' : 'dark')
          document.documentElement.classList.toggle('dark', theme === 'dark')
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          /* localStorage blocked — keep the dark default */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      This portfolio is an interactive single-page app. Please enable JavaScript, or email
      <a href="mailto:{EMAIL}">{EMAIL}</a>.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
